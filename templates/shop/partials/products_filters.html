<div class="bk-filter-card">

  <div class="bk-filter-header">

    <div>

      <div class="bk-filter-title">
        <i class="bi bi-sliders"></i>
        {{ _('فلترة المنتجات') }}
      </div>

      <div class="bk-filter-subtitle">
        {{ _('حدد القسم والتصنيف والترتيب') }}
      </div>

    </div>

  </div>


  <form
    method="get"
    action="/shop/products"
    class="bk-filter-form"
  >

    <!-- Search -->
    <div class="bk-filter-field">

      <label class="bk-filter-label">
        {{ _('بحث') }}
      </label>

      <div class="bk-filter-search">

        <i class="bi bi-search"></i>

        <input
          type="text"
          name="q"
          value="{{ q or '' }}"
          placeholder="{{ _('اسم أو كود المنتج') }}"
        >

      </div>

    </div>


    <!-- Department -->
    <div class="bk-filter-field">

      <label class="bk-filter-label">
        {{ pick_lang('القسم', 'Bölüm') }}
      </label>

      <select
        name="dept"
        class="form-select bk-filter-control"
      >

        <option
          value=""
          {% if not dept %}selected{% endif %}
        >
          {{ _('الكل') }}
        </option>

        <option
          value="electrical"
          {% if dept == 'electrical' %}selected{% endif %}
        >
          {{ pick_lang('كهربائيات', 'Elektrik') }}
        </option>

        <option
          value="linens"
          {% if dept == 'linens' %}selected{% endif %}
        >
          {{ pick_lang('بياضات', 'Tekstil') }}
        </option>

        <option
          value="crystal"
          {% if dept == 'crystal' %}selected{% endif %}
        >
          {{ pick_lang('بلوريات', 'Kristal') }}
        </option>

      </select>

    </div>


    {% if sub_categories %}

      <div class="bk-filter-field">

        <label class="bk-filter-label">
          {{ _('التصنيف الفرعي') }}
        </label>

        <select
          name="sub"
          class="form-select bk-filter-control"
        >

          <option value="">
            {{ _('الكل') }}
          </option>

          {% for sc in sub_categories %}

            <option
              value="{{ sc.id }}"
              {% if sub_id == sc.id %}selected{% endif %}
            >
              {{ pick_lang(sc.name, sc.name_tr) }}
            </option>

          {% endfor %}

        </select>

      </div>

    {% endif %}


    <!-- Discount -->
    <label class="bk-filter-check">

      <input
        type="checkbox"
        name="only_discounted"
        value="1"
        {% if only_discounted %}checked{% endif %}
      >

      <span class="bk-filter-check-box">
        <i class="bi bi-check"></i>
      </span>

      <span>
        {{ _('عروض فقط') }}
      </span>

    </label>


    <!-- Sort -->
    <div class="bk-filter-field">

      <label class="bk-filter-label">
        {{ _('الترتيب') }}
      </label>

      <select
        name="sort"
        class="form-select bk-filter-control"
      >

        <option
          value=""
          {% if not sort %}selected{% endif %}
        >
          {{ _('افتراضي') }}
        </option>

        <option
          value="new"
          {% if sort == 'new' %}selected{% endif %}
        >
          {{ _('الأحدث') }}
        </option>

      </select>

    </div>


    <!-- Actions -->
    <div class="d-grid gap-2">

      <button class="btn bk-btn-primary">
        <i class="bi bi-check2"></i>
        {{ _('تطبيق') }}
      </button>

      <a
        class="btn btn-outline-secondary"
        href="/shop/products"
      >
        {{ _('إعادة ضبط') }}
      </a>

    </div>


    {% if not is_shop_logged_in %}

      <div class="bk-filter-login-box">

        <i class="bi bi-lock"></i>

        <div>

          <div class="fw-semibold">
            {{ _('الأسعار خاصة بالعملاء') }}
          </div>

          <div class="small">
            {{ _('سجّل دخولك لرؤية أسعار المنتجات.') }}
          </div>

          <a href="/shop/login">
            {{ _('تسجيل الدخول') }}
          </a>

        </div>

      </div>

    {% endif %}

  </form>

</div>
